name: Test (branches and pull requests, no deploy)

# Runs unit tests, type-check, a production build and the end-to-end tests (iPhone 13 viewport, touch)
# in Chromium and in WebKit (Safari's engine) on every branch except main and on pull requests.
# It never publishes anything; deployment happens only from main.

on:
  push:
    branches-ignore: [main, gh-pages]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          BROWSER: ${{ matrix.browser }}
